domain_standard_note: 'Every domain-standard row above is layer: implementation — Synse plugins speak
  these protocols southbound to hardware. The northbound contract (synse.proto and the v3 HTTP API) is
  deliberately protocol-agnostic and declares no domain standard of its own; the whole product thesis
  is that a caller reads a temperature sensor over RS-485 the same way it reads a BMC over IPMI. Recorded
  as implementation rather than contract-level so this is not read as a contract-side declaration.'
