note: Vapor IO ships no MCP server. Searched the vapor-ware GitHub organization (64 public repositories,
  none MCP-related), the Synse documentation site and the vaporio Docker Hub organization; nothing hosted,
  nothing stdio. No MCPServer pointer is wired into apis.yml, because a pointer would assert an agent
