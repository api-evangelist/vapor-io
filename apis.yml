apis:
- aid: vapor-io:synse-server
  name: Synse Server API (v3)
  description: 'Synse Server exposes a uniform HTTP and WebSocket API for reading from
    and writing to physical and virtual devices through protocol-specific plugins.
    The same 18 operations are available over both transports: status, version, config,
    plugin summary/detail/health, device scan, tags, device info, read, read-by-device,
    read cache, streamed readings (WebSocket only), asynchronous and synchronous writes,
    and transaction status. Synse Server is self-hosted; the base URL is the host and
    port of the operator''s own deployment, which defaults to port 5000.'
  humanURL: https://synse.readthedocs.io/en/latest/server/api.v3/
  baseURL: http://{synse-server-host}:5000
