aid: vapor-io
name: Vapor IO
description: 'Vapor IO is an Austin, Texas edge computing company that builds and operates
  the Kinetic Grid, a carrier-neutral network of micro modular data centers offering
  edge colocation, interconnection, networking and network-delivered AI across dozens
  of US markets and, through a Cellnex partnership, into Europe. Its public, machine-readable
  developer surface is the open source Synse platform, published under the vapor-ware
  GitHub organization: Synse Server, a uniform HTTP and WebSocket API for monitoring
  and controlling physical and virtual devices (data center equipment, IoT devices,
  building management systems, edge hardware), and the Synse plugin gRPC API, whose
  Protocol Buffers contract is published in full. Protocol-specific plugins cover IPMI,
  SNMP, Modbus over TCP/IP, Intel AMT and Juniper JTI, with Go and Python SDKs, a Go
  CLI, Helm charts and Docker images. Kinetic Grid Portal telemetry is described as
  API-accessible but is documented only to customers.'
