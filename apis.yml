- aid: vapor-io:synse-plugin-grpc
  name: Synse Plugin gRPC API (V3Plugin)
  description: 'The internal gRPC API for bi-directional communication between Synse
    Server and Synse plugins. The published Protocol Buffers contract defines the V3Plugin
    service with 12 RPCs — Devices, Health, Metadata, Read, ReadCache, ReadStream,
    Test, Transaction, Transactions, Version, WriteAsync and WriteSync — six of which
    return server streams, plus 24 messages and three enums. Plugins are self-hosted
    and listen on port 5001 by default.'
  humanURL: https://github.com/vapor-ware/synse-server-grpc
  baseURL: grpc://{synse-plugin-host}:5001
  tags:
  - gRPC
  - Device Management
  - Telemetry
