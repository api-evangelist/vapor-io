  - name: write-to-device-and-track-transaction
    file: write-to-device-and-track-transaction.md
    description: >-
      Issue a write to physical or virtual hardware and follow the transaction. Carries the
      irreversibility warning: Synse documents no cancel, undo, rollback or restore.
    destructive: true
    operations:
      - GET /v3/info/{device}
      - GET /v3/read/{device}
      - POST /v3/write/{device}
