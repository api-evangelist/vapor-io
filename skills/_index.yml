skills:
  - name: read-device-telemetry
    file: read-device-telemetry.md
    description: >-
      Discover the devices a deployment manages and read their current values, using tags
      rather than pagination to narrow the set.
    operations:
      - GET /test
      - GET /version
      - GET /v3/scan
